# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rebuttal
      POSTGRES_PASSWORD: rebuttal
      POSTGRES_DB: rebuttal
    ports:
      - "5432:5432"
    volumes:
      - rebuttal-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  rebuttal-db:
