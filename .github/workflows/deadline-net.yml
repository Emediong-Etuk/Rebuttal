# Free scheduler for the deadline safety net when hosting on Vercel's free plan (its own crons are daily only).
# Needs two repository secrets: APP_URL (e.g. https://rebuttal.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Deadline net
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.DEADLINE_NET_ENABLED != 'false' }}
    steps:
      - name: Run deadline net
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS -X POST "$APP_URL/api/cron/deadline" -H "Authorization: Bearer $CRON_SECRET" --max-time 280
