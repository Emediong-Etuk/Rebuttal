name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rebuttal
          POSTGRES_PASSWORD: rebuttal
          POSTGRES_DB: rebuttal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rebuttal" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://rebuttal:rebuttal@localhost:5432/rebuttal_test
      TEST_DATABASE_URL: postgres://rebuttal:rebuttal@localhost:5432/rebuttal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
